<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self';img-src qingread://book;frame-src 'self'"><link rel="stylesheet" href="app.css"><script defer src="i18n.js"></script><script defer src="app.js"></script><title>轻阅 Electron</title></head><body>
<header><button id="back" hidden title="返回书架" aria-label="返回书架"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 4-6 6 6 6M4 10h13"/></svg></button><span id="title">轻阅</span><button id="transparent" title="透明背景" aria-label="透明背景"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 3v14M10 3a7 7 0 0 1 0 14Z"/></svg></button><button id="opacityToggle" title="调整透明度" aria-label="调整透明度"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/></svg></button><button id="pin" title="置顶" aria-label="置顶" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 6 0-1 5 3 3v1H5v-1l3-3-1-5ZM10 12v5"/></svg></button><button id="small" title="切换大窗" aria-label="切换大窗"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="sizeIcon" d="M7 3H3v4M13 3h4v4M3 13v4h4M17 13v4h-4"/></svg></button><button id="minimize" title="最小化" aria-label="最小化"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button><button id="close" title="关闭" aria-label="关闭"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></header>
<main id="library"><nav><h1>书架</h1><button id="shelfSettingsToggle" title="书架设置" aria-label="书架设置" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 2h4l1 3 3 1 2 4-2 4-3 1-1 3H8l-1-3-3-1-2-4 2-4 3-1z"/><circle cx="10" cy="10" r="3"/></svg></button><button id="import">＋ 导入书籍</button></nav><input id="filter" placeholder="搜索书名或作者"><div id="books"></div></main>
<div id="shelfSettingsBackdrop" hidden></div>
<aside id="shelfSettingsPanel" aria-labelledby="shelfSettingsHeading" hidden>
 <div class="shelf-settings-header"><h2 id="shelfSettingsHeading">书架设置</h2><button id="shelfSettingsClose" title="关闭书架设置" aria-label="关闭书架设置">×</button></div>
 <div class="shelf-settings-content">
  <h3>界面语言</h3><label class="shelf-choice"><select id="interfaceLanguage" aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
  <h3>排序规则</h3>
  <label class="shelf-choice"><input type="radio" name="shelfSort" id="shelfSortManual" value="manual">拖拽排序</label>
  <label class="shelf-choice"><input type="radio" name="shelfSort" id="shelfSortRecent" value="recent">上次阅读时间倒序</label>
  <h3>分类显示</h3>
  <label class="shelf-choice"><input type="checkbox" id="shelfCategoryCounts">显示分类书籍数量</label>
  <h3>封面设置</h3><p class="shelf-settings-note">控制书架书名、阅读进度和书籍类型显示。</p>
  <label class="shelf-choice"><input type="checkbox" id="shelfCoverTitle">书名</label>
  <label class="shelf-choice"><input type="checkbox" id="shelfCoverProgress">阅读进度</label>
  <label class="shelf-choice"><input type="checkbox" id="shelfCoverType">书籍类型</label>
 </div>
</aside>
<div id="jumpPanel" hidden><div class="opacity-heading"><label for="jumpRange">阅读进度</label><div><input id="jumpPercent" type="number" min="0" max="100" step="0.1" aria-label="阅读进度百分比"><span>%</span></div></div><input id="jumpRange" type="range" min="0" max="100" step="0.1"><div class="opacity-scale"><span>0%</span><span>100%</span></div></div>
<div id="opacityPanel" hidden><div class="opacity-heading"><label for="opacity">透明度调节</label><div><input id="opacityPercent" type="number" min="1" max="100" step="1" aria-label="不透明度百分比"><span>%</span></div></div><input id="opacity" type="range" min="0.01" max="1" step="0.01"><div class="opacity-scale"><span>1%</span><span>100%</span></div></div>
<main id="reading" hidden><aside id="sidebar" hidden><nav><button data-side="toc">目录</button><button data-side="search">搜索</button><button data-side="bookmarks">书签</button></nav><input id="query" placeholder="输入关键词"><div id="results"></div></aside><iframe id="reader" src="reader/index.html"></iframe><aside id="settings" hidden><h2>阅读设置</h2><div id="fields"></div><h3>窗口设置</h3><label><input type="checkbox" id="autohide">工具栏自动隐藏</label><label><input type="checkbox" id="hoverhide">鼠标移出暂隐</label><label><input type="checkbox" id="capture">截图保护</label><label>老板键<input id="bosskey" readonly placeholder="点击后按组合键" title="点击后按组合键"></label><button id="saveBoss">应用老板键</button><p id="bossKeyResult" role="status"></p><button id="reset">恢复阅读默认值</button></aside></main>
<footer id="toolbar" hidden><div class="tool-group"><button data-side="toc" title="目录" aria-label="目录"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"/></svg></button><button id="settingsToggle" title="阅读设置" aria-label="阅读设置"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3 15 5-11 5 11M5 11h6M14 10c4-4 6 2 3 4-3 2-5-3-1-4"/></svg></button><button data-side="search" title="全文搜索" aria-label="全文搜索"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 4 4"/></svg></button><button id="addBookmark" title="添加书签" aria-label="添加书签"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10v14l-5-3-5 3zM8 7h4M10 5v4"/></svg></button></div><div class="tool-group navigation"><button id="prev" title="上一页" aria-label="上一页"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg></button><button id="returnPosition" hidden title="返回原进度">返回原进度</button><span id="progress"></span><button id="next" title="下一页" aria-label="下一页"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg></button></div><div class="tool-group"><button id="jump">跳转</button><button id="mode">滚动</button><button id="auto">自动</button><button id="single">单行</button><button data-side="bookmarks">书签</button></div></footer><div id="status" role="status" hidden><span id="statusText"></span><button id="statusClose" type="button" title="关闭提示" aria-label="关闭提示">×</button></div>
<div id="bookContextMenu" role="menu" hidden><button role="menuitem" data-action="editBook">编辑</button><button role="menuitem" data-action="exportBook">导出</button><button role="menuitem" data-action="removeBook">删除</button></div>
<dialog id="deleteBookDialog" class="delete-confirm"><form method="dialog"><p>确认删除这本书？</p><menu><button value="confirm">确认</button><button value="cancel" autofocus>取消</button></menu></form></dialog>
<dialog id="deleteBookmarkDialog"><form method="dialog"><p>确认删除这个书签？</p><menu><button value="confirm">确认</button><button value="cancel" autofocus>取消</button></menu></form></dialog>
<dialog id="prompt"><form method="dialog"><label id="promptLabel"></label><input id="promptValue"><menu><button value="cancel">取消</button><button value="ok">确定</button></menu></form></dialog>
<dialog id="editBookDialog"><form method="dialog"><h2>编辑书籍</h2><label for="editBookTitle">书名</label><input id="editBookTitle" required maxlength="200"><label for="editBookCategory">分类</label><input id="editBookCategory" maxlength="30"><menu><button value="cancel" formnovalidate>取消</button><button value="save">保存</button></menu></form></dialog>
</body></html>
